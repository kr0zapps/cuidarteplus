name: "Pipeline DevSecOps - Cuidarte+ (EP5)"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. Pruebas automatizadas del backend (Jest + Supertest) y cobertura
  # ---------------------------------------------------------------
  jest:
    name: Jest (Pruebas Unitarias e Integracion)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: BACKEND
        run: npm ci

      - name: Ejecutar pruebas Jest con cobertura
        working-directory: BACKEND
        run: npx jest --runInBand --forceExit --coverage --coverageReporters=text --coverageReporters=lcov

      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jest
          path: BACKEND/coverage/
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 2. Pruebas E2E del frontend (Playwright)
  # ---------------------------------------------------------------
  e2e:
    name: Playwright (Pruebas E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright (raiz)
        run: npm ci --ignore-scripts

      - name: Instalar dependencias del frontend
        working-directory: FRONTEND
        run: npm ci

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Levantar el frontend en el puerto 5173
        working-directory: FRONTEND
        run: nohup npm run dev -- --host 0.0.0.0 --port 5173 > ../vite.log 2>&1 &

      - name: Esperar a que el frontend responda
        run: |
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:5173/login | grep -q 200; then
              echo "Frontend disponible"
              exit 0
            fi
            sleep 2
          done
          echo "El frontend no respondio a tiempo"
          cat vite.log
          exit 1

      - name: Ejecutar pruebas E2E
        run: npx playwright test

      - name: Guardar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # 3. Analisis estatico de seguridad (CodeQL, SAST)
  # ---------------------------------------------------------------
  codeql:
    name: CodeQL (Analisis SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Ejecutar analisis CodeQL
        uses: github/codeql-action/analyze@v3

  # ---------------------------------------------------------------
  # 4. Calidad de codigo (SonarCloud). Requiere el secreto
  #    SONAR_TOKEN; si falta, el analisis se omite y queda un
  #    aviso visible en la ejecucion.
  # ---------------------------------------------------------------
  sonarqube:
    name: SonarCloud (Calidad Estatica)
    runs-on: ubuntu-latest
    needs: jest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar informe de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura-jest
          path: BACKEND/coverage

      - name: Avisar si falta la configuracion de SonarCloud
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning title=SonarCloud omitido::Falta el secreto SONAR_TOKEN. No se ejecuto el analisis."

      - name: Ajustar rutas del informe de cobertura
        if: ${{ env.SONAR_TOKEN != '' }}
        run: sed -i 's#^SF:#SF:BACKEND/#' BACKEND/coverage/lcov.info

      - name: Analisis SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5

  # ---------------------------------------------------------------
  # 5. Analisis dinamico (OWASP ZAP baseline) contra la API levantada
  # ---------------------------------------------------------------
  zap:
    name: OWASP ZAP (Analisis DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del backend
        working-directory: BACKEND
        run: npm ci

      - name: Levantar la API en el puerto 3000
        working-directory: BACKEND
        env:
          PORT: 3000
        run: nohup node src/app.js > ../api.log 2>&1 &

      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -q 200; then
              echo "API disponible"
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondio a tiempo"
          cat api.log
          exit 1

      - name: Ejecutar ZAP baseline
        run: |
          chmod 777 "$PWD"
          docker run --rm --network host -v "$PWD":/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -r zap-report.html -I

      - name: Guardar reporte de ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-zap
          path: zap-report.html
          if-no-files-found: warn
