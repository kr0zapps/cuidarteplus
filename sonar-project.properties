# ============================================================
#  Configuración SonarQube / SonarCloud - Cuidarte+
#  Actividad 2: Revisar y probar código SonarQube, CodeQL, Jest
# ============================================================

sonar.projectKey=cuidarteplus-is1102
sonar.projectName=CuidartePlus
sonar.projectVersion=1.0.0

# Fuentes a analizar
sonar.sources=BACKEND/src,FRONTEND/src
sonar.tests=BACKEND/tests,tests/playwright

# Inclusiones y exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/uploads/**
sonar.sourceEncoding=UTF-8

# Cobertura de pruebas (LCOV generado por Jest)
sonar.javascript.lcov.reportPaths=BACKEND/coverage/lcov.info

# Reglas de calidad y seguridad
sonar.qualitygate.wait=true
